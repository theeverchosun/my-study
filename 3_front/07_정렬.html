<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>정렬(flex grid)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
    <style>
       * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

        }
        body{
            background-color: aliceblue;
            font-family: "Song Myung", serif;
            font-size: 26px;
            padding-top: 60px;
        }
        ul,ol{
            list-style-type: none;
        }
        /*flex box 1차원정렬 방식 (가로세로)
        한방향으로 나열된 아이템 요소 들의 간격과 정렬을 맞출때 주로사용*/
        nav {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 60px;
            background-color: rgb(196, 41, 41);
            color: aliceblue;
            padding: 0 24px;

            display: flex;
            flex-direction: row;/*기본값 row 축방향*/

             /*justify-content: flex-end;*/
             justify-content: space-between; /*주축 기준으로 양끝정렬*/

             align-items: center; /* 교차축 중심으로 가운데 정렬*/  


        }
        .menu{
            display: flex;
            gap: 20px;
        }
        .menu > li{
            cursor: pointer; /*마우스모양을 손모양으로*/
        }
        .menu >li:hover {
            color: rgb(219, 241, 14);
        }
        /*grid 2차원 정렬 방식
        min max(250 1) 카드 최소너비 250유지하되 공간이 남으면 1fr에 맞춰 유지
        auto fit 디바이스 가로 축 부모요소에 크기에 맞춰 가능 한 많은 행열 을 자동으로 맞
        
        
        */
        main {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));

            gap: 20px;
            padding: 30px;
        }
        .card {
            background-color: azure;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 2px 4px #645a5a rgba(0, 0, 0, 0.1);
            cursor: pointer;

            transition: all 0.3s ease;
        }
        .card:hover{
            box-shadow: 0 8px 16px #645a5a rgba(red, green, blue, alpha);
            transform: translateY(-5px);
        }
        .card h3 {
            color: chartreuse;
            margin-bottom: 12px;

        }
        .card p {
            color: #645a5a;
            font-size: 1.3rem;
        }


    </style>




</head>
<body>
    <h1>
        정렬 실습
    </h1>

    <!-- flex 박스nav>.logo+ul.menu>li*4 -->
     <nav>
        <div class="logo">FlexBox Navigation</div>
        <ul class="menu">
            <li>홈</li>
            <li>소개</li>
            <li>서비스</li>
            <li>문의</li>
        </ul>
     </nav>

     <!-- grid -->
      <main> 
        <div class="card">
        <h3>flexbox 특징</h3>
        <p>
            한 방향으로 아이템을 정렬할때 사용
            네비게이션 바나 요소 내부 정렬에 적합함
        </p>
      </div>
      <div class="card">
        <h3>grid 특징</h3>
        <p>
            가로세로행렬을 동시에 관리하는 2차원 레이아웃
            전체 페이지 구조나 카드 갤러리 배치에 적합
        </p>
      </div>
      <div class="card">
        <h3></h3>점메추</h3>
        <p>
            오늘은 뭐먹지
        </p>
      </div>
      </main>
    
</body>
</html>
